[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-ipo-deadline-tracker"
version = "0.1.0"
description = "Deterministic IPO schedule and deadline tracker for NSE IPO records"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "httpx>=0.27",
    "playwright>=1.42",
    "pytest>=8.0",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["validation/harness"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.bandit]
exclude_dirs = ["validation", "specs"]
