<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}IPO Deadline Tracker{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous">
    <link href="{{ url_for('static', path='/css/styles.css') }}" rel="stylesheet">
  </head>
  <body>
    <header class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/">IPO Deadline Tracker</a>
        <a class="btn btn-light btn-sm" href="/ipos/new">Add IPO</a>
      </div>
    </header>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
    <footer class="container pb-4 text-secondary small">
      IPO dates are user-maintained. Public holidays are not excluded from the
      three-working-day listing-date rule.
    </footer>
    <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
  </body>
</html>
